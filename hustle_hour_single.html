<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hustle Hour — Live Quiz</title>
<meta name="theme-color" content="#1a56db">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Hustle Hour — blue / orange / white ===== */
:root{
  --blue:#1a56db; --blue-d:#0b2a6f; --sky:#38a1ff; --orange:#ff7a1a; --orange-d:#e65f00;
  --bg:#f3f6fd; --surface:#ffffff; --surface-2:#eaf0fc; --text:#0b1a3a; --muted:#5b6b8c;
  --border:#d9e2f3; --shadow:0 10px 30px rgba(11,42,111,.12); --glow:rgba(26,86,219,.28);
  --radius:20px; --ease:cubic-bezier(.2,.8,.2,1);
  --font:'Poppins','Noto Sans Tamil','Noto Sans Sinhala',system-ui,-apple-system,Segoe UI,sans-serif;
}
[data-theme="dark"]{
  --bg:#050b22; --surface:#0d1737; --surface-2:#13214a; --text:#eef2ff; --muted:#9db0d8;
  --border:#1f2f61; --shadow:0 12px 34px rgba(0,0,0,.5); --glow:rgba(255, 77, 255, 0.35);
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
  transition:background .4s var(--ease),color .4s var(--ease);overflow-x:hidden}
button,input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* animated background */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.32;animation:float 20s ease-in-out infinite alternate}
.bg i:nth-child(1){width:46vmax;height:46vmax;background:var(--blue);top:-15vmax;left:-12vmax}
.bg i:nth-child(2){width:36vmax;height:36vmax;background:var(--orange);bottom:-14vmax;right:-8vmax;animation-delay:-6s}
.bg i:nth-child(3){width:26vmax;height:26vmax;background:var(--sky);top:35%;left:55%;animation-delay:-11s;opacity:.2}
[data-theme="dark"] .bg i{opacity:.22}
@keyframes float{to{transform:translate3d(6vmax,4vmax,0) scale(1.15)}}

/* top bar */
.site-head{position:sticky;top:0;z-index:30}
.topbar{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px clamp(14px,4vw,32px);backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);
  border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.logo{width:42px;height:42px;filter:drop-shadow(0 4px 10px var(--glow));transition:transform .5s var(--ease)}
.brand:hover .logo{transform:rotate(180deg)}
.brand-text{display:flex;flex-direction:column;line-height:1}
.brand-text b{font-weight:800;font-size:1.25rem;letter-spacing:.04em}
.brand-text em{font-style:normal;color:var(--orange)}
.brand-text small{font-weight:700;letter-spacing:.5em;font-size:.62rem;color:var(--muted);margin-top:3px}
.controls{display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.85rem;
  color:var(--muted);transition:all .25s var(--ease)}
.seg button.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;box-shadow:0 4px 12px var(--glow)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--surface);cursor:pointer;
  display:grid;place-items:center;transition:transform .3s var(--ease),background .3s;position:relative;color:var(--text)}
.icon-btn:hover{transform:rotate(18deg) scale(1.1)}
.icon-btn:active{transform:scale(.9)}
.i-moon{display:none}
[data-theme="dark"] .i-sun{display:none}
[data-theme="dark"] .i-moon{display:block}
.conn-banner{position:fixed;top:calc(var(--head-h,64px) + 8px);left:50%;transform:translateX(-50%);z-index:60;background:var(--orange);color:#fff;
  padding:8px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);animation:slideDown .4s var(--ease)}
.conn-banner.ok{background:#16a34a}
@keyframes slideDown{from{transform:translate(-50%,-30px);opacity:0}}

/* navigation bar */
.navbar{background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav-links{list-style:none;display:flex;gap:8px;max-width:1100px;margin:0 auto;padding:8px clamp(14px,4vw,32px);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;border:1px solid transparent;
  color:var(--muted);font-weight:600;font-size:.92rem;text-decoration:none;white-space:nowrap;
  transition:background .25s var(--ease),color .25s,border-color .25s,box-shadow .25s}
.nav-links a:hover{color:var(--text);background:var(--surface);border-color:var(--border)}
.nav-links a.on{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;border-color:transparent;box-shadow:0 4px 12px var(--glow)}
.nav-links a.nav-cta{color:var(--orange-d)}
.nav-links a.nav-cta:hover{border-color:var(--orange)}
[data-theme="dark"] .nav-links a.nav-cta{color:#ffb066}
.nav-ico{font-size:1rem;line-height:1}
@media (max-width:640px){
  .nav-links a{font-size:.85rem;padding:6px 12px}
}

/* layout */
main{max-width:1100px;margin:0 auto;padding:clamp(16px,3vw,32px)}
.view{display:none}
.view.active{display:block;animation:viewIn .55s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(18px) scale(.99)}}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
h2{font-size:clamp(1.4rem,3vw,2rem);font-weight:800}
h3{font-weight:700}

/* hero + home */
.hero{text-align:center;margin:clamp(10px,4vw,40px) 0 28px}
.hero h1{font-size:clamp(1.9rem,5.5vw,3.4rem);font-weight:800;line-height:1.15;
  background:linear-gradient(120deg,var(--blue),var(--sky) 45%,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.tagline{margin-top:10px;color:var(--muted);font-size:clamp(1rem,2vw,1.2rem);font-style:italic}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;max-width:820px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;transition:transform .35s var(--ease),box-shadow .35s}
.card:hover{transform:translateY(-6px)}
.card-ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem}
.card-ico.orange{background:linear-gradient(135deg,#ffe3cc,#ffc59a)}
.card-ico.blue{background:linear-gradient(135deg,#d6e6ff,#a8cbff)}
.pop-in{animation:popIn .6s var(--ease) both;animation-delay:calc(var(--i,0)*90ms)}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.95)}}
.demo-note{text-align:center;margin-top:22px;font-size:.85rem;color:var(--muted)}
#joinForm{display:flex;flex-direction:column;gap:12px}

/* fields */
.field{width:100%;padding:.8rem 1rem;border-radius:14px;border:1.5px solid var(--border);background:var(--surface-2);font-size:1rem;
  transition:border-color .2s,box-shadow .2s,transform .2s}
.field:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 4px var(--glow);transform:translateY(-1px)}
.code-in{text-align:center;letter-spacing:.5em;font-weight:800;font-size:1.4rem}
textarea.field{resize:vertical;min-height:64px}
select.field{width:auto;padding:.5rem .7rem;cursor:pointer}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.3rem;
  border:0;border-radius:14px;font-weight:600;font-size:1rem;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--sky));
  box-shadow:0 8px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .25s var(--ease),box-shadow .25s,filter .25s}
.btn::after{content:"";position:absolute;top:0;left:-120%;width:60%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);transition:left .6s var(--ease)}
.btn:hover::after{left:140%}
.btn:hover{transform:translateY(-3px) scale(1.03);filter:brightness(1.07);box-shadow:0 14px 28px var(--glow)}
.btn:active{transform:translateY(0) scale(.96)}
.btn.accent{background:linear-gradient(135deg,var(--orange-d),var(--orange) 60%,#ffa24d);box-shadow:0 8px 20px rgba(255,122,26,.38),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.accent:hover{box-shadow:0 14px 28px rgba(255,122,26,.5)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn.ghost:hover{border-color:var(--blue);box-shadow:0 6px 16px var(--glow)}
.btn.danger{background:linear-gradient(135deg,#dc2626,#f87171)}
.btn.lg{padding:1rem 1.8rem;font-size:1.1rem}
.btn.sm{padding:.5rem .9rem;font-size:.88rem;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* dashboard cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.qz-card{animation:popIn .5s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.qz-card h3{font-size:1.15rem;word-break:break-word}
.qz-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--muted)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:14px 18px;
  border-radius:16px;background:linear-gradient(135deg,rgba(255,122,26,.18),rgba(26,86,219,.15));border:1px dashed var(--orange);
  animation:popIn .5s var(--ease)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--border);font-weight:600;font-size:.85rem}
.pill.o{background:rgba(255,122,26,.15);border-color:var(--orange);color:var(--orange-d)}
[data-theme="dark"] .pill.o{color:#ffb066}

/* editor */
.editor-bar{position:sticky;top:var(--head-h,64px);z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;margin-bottom:18px;
  border-radius:18px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);border:1px solid var(--border);box-shadow:var(--shadow)}
.title-in{flex:1;min-width:180px;font-weight:700;font-size:1.1rem}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap}
.qcard{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;animation:popIn .45s var(--ease) both;transition:border-color .3s}
.qcard.invalid{border-color:#ef4444;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qnum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--orange-d),var(--orange))}
.qhead .spacer{flex:1}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;font-size:1rem;
  transition:transform .2s var(--ease),background .2s}
.mini:hover{transform:scale(1.15);background:var(--border)}
.mini:disabled{opacity:.35;pointer-events:none}
.err{color:#ef4444;font-weight:600;font-size:.88rem}
.opts-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.orow{display:flex;align-items:center;gap:8px;padding:6px;border-radius:14px;border:2px solid transparent;background:var(--surface-2)}
.orow input[type=text]{flex:1;border:0;background:transparent;padding:.55rem;font-size:.98rem;min-width:0}
.orow input[type=text]:focus{outline:0}
.orow.a0{border-color:var(--blue)}.orow.a1{border-color:var(--orange)}.orow.a2{border-color:var(--blue-d)}.orow.a3{border-color:var(--sky)}
.mark{position:relative;width:26px;height:26px;flex:none;cursor:pointer}
.mark input{position:absolute;opacity:0;inset:0;cursor:pointer}
.mark span{position:absolute;inset:0;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;transition:all .25s var(--ease)}
.mark input[type=checkbox]+span{border-radius:8px}
.mark input:checked+span{background:#16a34a;border-color:#16a34a;transform:scale(1.12)}
.mark input:checked+span::after{content:"✓";color:#fff;font-weight:800;font-size:.9rem}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);margin:0 7px}
.x{border:0;background:transparent;font-size:1.3rem;cursor:pointer;color:var(--muted);width:28px;transition:color .2s,transform .2s}
.x:hover{color:#ef4444;transform:scale(1.3)}
.x:disabled{opacity:.3;pointer-events:none}
.tf-seg{display:flex;gap:10px}
.tf-seg label{flex:1;cursor:pointer}
.tf-seg input{position:absolute;opacity:0}
.tf-seg span{display:block;text-align:center;padding:.8rem;border-radius:14px;border:2px solid var(--border);font-weight:700;transition:all .25s var(--ease)}
.tf-seg input:checked+span{background:linear-gradient(135deg,var(--blue),var(--sky));color:#fff;border-color:transparent;transform:scale(1.04);box-shadow:0 8px 20px var(--glow)}
.tf-seg label:last-child input:checked+span{background:linear-gradient(135deg,var(--orange-d),var(--orange))}
.inline{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.inline label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600}
.add-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:6px 0 40px}
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border:1.5px dashed var(--blue);background:transparent;padding:.5rem .9rem;border-radius:999px;cursor:pointer;font-weight:600;color:var(--blue);
  transition:all .25s var(--ease)}
[data-theme="dark"] .chip-btn{color:var(--sky);border-color:var(--sky)}
.chip-btn:hover{background:var(--blue);color:#fff;transform:translateY(-2px) scale(1.05);border-style:solid}

/* answer buttons (player + preview) */
.ans-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.ans-grid.n3,.ans-grid.n5{grid-template-columns:repeat(2,1fr)}
.ans{position:relative;display:flex;align-items:center;gap:12px;min-height:84px;padding:14px 16px;border:0;border-radius:18px;color:#fff;
  font-weight:700;font-size:1.05rem;cursor:pointer;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.22);
  transition:transform .2s var(--ease),box-shadow .2s,opacity .3s,filter .3s;animation:popIn .45s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.ans:hover{transform:translateY(-3px)}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.ans .shape{font-size:1.5rem;opacity:.9;flex:none}
.ans .lbl{word-break:break-word}
.a0.ans,.opt.a0{background:linear-gradient(135deg,var(--blue),#2f6bff)}
.a1.ans,.opt.a1{background:linear-gradient(135deg,var(--orange-d),var(--orange))}
.a2.ans,.opt.a2{background:linear-gradient(135deg,var(--blue-d),#1b46b0)}
.a3.ans,.opt.a3{background:linear-gradient(135deg,#1d8fe8,var(--sky))}
.ans.sel{outline:4px solid #fff;transform:scale(1.03)}
.ans.picked{outline:4px solid #fff;transform:scale(1.03)}
.ans:disabled{cursor:default;pointer-events:none}
.ans:disabled:not(.picked):not(.sel){opacity:.45;filter:grayscale(.4)}
.text-ans{display:flex;gap:10px;flex-wrap:wrap}
.text-ans .field{flex:1;min-width:200px;font-size:1.2rem;font-weight:600}
.submit-row{margin-top:14px;display:flex;justify-content:center}

/* shared stage styling */
.stage{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.qtext{font-size:clamp(1.3rem,3.6vw,2.2rem);font-weight:800;line-height:1.3;word-break:break-word;animation:popIn .5s var(--ease)}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.8rem;font-weight:700;color:var(--muted)}
.code{font-size:clamp(3rem,12vw,6.5rem);font-weight:800;letter-spacing:.12em;line-height:1;
  background:linear-gradient(120deg,var(--blue),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;animation:popIn .7s var(--ease)}
.panel{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(16px,3vw,30px);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:50px;width:100%}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
  font-weight:600;animation:chipIn .5s var(--ease);transition:opacity .3s,filter .3s}
.pchip.off{opacity:.45;filter:grayscale(1)}
.pchip button{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1rem;border-radius:50%;width:22px;height:22px}
.pchip button:hover{background:#ef4444;color:#fff}
@keyframes chipIn{from{opacity:0;transform:scale(.3) rotate(-8deg)}60%{transform:scale(1.12)}}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:.9rem;flex:none}
.avatar.big{width:92px;height:92px;font-size:2.4rem;box-shadow:0 10px 30px var(--glow)}

/* timer */
.ring{position:relative;width:86px;height:86px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring-bg{stroke:var(--border)}
.ring-fg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:276.46;transition:stroke .3s}
.ring.low .ring-fg{stroke:var(--orange)}
.ring.low{animation:pulse .8s ease-in-out infinite}
.ring-num{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:1.7rem}
@keyframes pulse{50%{transform:scale(1.08)}}
.bar{width:100%;height:12px;border-radius:99px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;transform-origin:left;background:linear-gradient(90deg,var(--blue),var(--sky))}
.bar.low i{background:linear-gradient(90deg,var(--orange-d),var(--orange))}
.big-count{font-size:clamp(6rem,30vw,12rem);font-weight:800;line-height:1;color:var(--orange)}
.pop{animation:cd .6s var(--ease)}
@keyframes cd{from{transform:scale(2.2);opacity:0}}

/* host question + reveal */
.hq-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:12px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%}
.opt{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:18px;color:#fff;font-weight:700;font-size:1.1rem;text-align:left;
  animation:popIn .5s var(--ease) both;animation-delay:calc(var(--i,0)*80ms)}
.opt .shape{font-size:1.5rem}
.rv{width:100%;display:flex;flex-direction:column;gap:10px}
.rv-row{position:relative;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--surface-2);overflow:hidden;
  border:2px solid transparent;text-align:left;font-weight:700}
.rv-row .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(26,86,219,.35),rgba(56,161,255,.2));
  transition:width 1s var(--ease)}
.rv-row.ok{border-color:#16a34a;background:rgba(22,163,74,.14)}
.rv-row.ok .fill{background:linear-gradient(90deg,rgba(22,163,74,.5),rgba(22,163,74,.2))}
.rv-row.dim{opacity:.55}
.rv-row>*{position:relative}
.rv-row .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.answer-box{padding:16px 24px;border-radius:18px;background:rgba(22,163,74,.14);border:2px solid #16a34a;font-weight:800;font-size:1.4rem;animation:popIn .5s var(--ease)}

/* leaderboard */
.board{position:relative;width:100%;max-width:640px;margin:0 auto}
.brow{position:absolute;left:0;right:0;height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;border-radius:14px;background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow);font-weight:700;opacity:0;
  transition:transform .8s var(--ease),opacity .5s}
.brow .rk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:.9rem;flex:none}
.brow.top .rk{color:#fff;background:linear-gradient(135deg,var(--orange-d),var(--orange))}
.brow .nm{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .sc{font-variant-numeric:tabular-nums;color:var(--blue)}
[data-theme="dark"] .brow .sc{color:var(--sky)}
.brow.me{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,122,26,.3)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;height:300px;width:100%}
.pcol{width:min(28vw,160px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.pcol .pn{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcol .ps{color:var(--muted);font-weight:600;font-size:.9rem}
.pcol .medal{font-size:2.2rem;animation:cd .8s var(--ease) both;animation-delay:calc(var(--d)+.6s)}
.pstep{width:100%;border-radius:16px 16px 0 0;height:0;background:linear-gradient(180deg,var(--blue),var(--blue-d));display:grid;place-items:start center;padding-top:8px;
  color:#fff;font-size:2rem;font-weight:800;animation:grow 1s var(--ease) forwards;animation-delay:var(--d)}
.pcol.p1 .pstep{background:linear-gradient(180deg,var(--orange),var(--orange-d))}
@keyframes grow{to{height:var(--h)}}

/* player */
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;padding:10px 14px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
.pbar .who{display:flex;gap:10px;align-items:center;font-weight:700;min-width:0}
.pbar .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-pill{font-weight:800;color:var(--orange-d);font-variant-numeric:tabular-nums}
[data-theme="dark"] .score-pill{color:#ffb066}
.result{width:100%;max-width:520px;padding:28px 20px;border-radius:24px;color:#fff;animation:popIn .6s var(--ease)}
.result.ok{background:linear-gradient(135deg,#15803d,#22c55e)}
.result.bad{background:linear-gradient(135deg,#b91c1c,#f87171)}
.result.none{background:linear-gradient(135deg,var(--blue-d),var(--blue))}
.result.poll{background:linear-gradient(135deg,var(--blue),var(--sky))}
.result .big{font-size:2.2rem;font-weight:800}
.result .pts{font-size:2.6rem;font-weight:800;margin-top:6px}
.stat-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.stat{padding:12px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--border);min-width:100px}
.stat b{display:block;font-size:1.6rem;font-weight:800}
.stat span{color:var(--muted);font-size:.8rem;font-weight:600}
.lock{padding:12px 20px;border-radius:14px;background:rgba(22,163,74,.15);border:1px solid #16a34a;font-weight:700;animation:popIn .4s var(--ease)}
.spinner{width:46px;height:46px;border-radius:50%;border:5px solid var(--border);border-top-color:var(--orange);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.waiting-dots span{display:inline-block;animation:dots 1.2s infinite;font-weight:800}
.waiting-dots span:nth-child(2){animation-delay:.2s}.waiting-dots span:nth-child(3){animation-delay:.4s}
@keyframes dots{50%{transform:translateY(-6px);color:var(--orange)}}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,11,34,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--border);border-radius:26px;padding:clamp(16px,3vw,28px);
  box-shadow:0 30px 80px rgba(0,0,0,.5);animation:modalIn .5s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translateY(40px) scale(.94)}}
.pv-head{display:flex;gap:8px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.pv-head .spacer{flex:1}
#pvResult{margin-top:16px;min-height:10px}

/* toasts + confetti */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{padding:11px 20px;border-radius:14px;background:var(--blue-d);color:#fff;font-weight:600;box-shadow:var(--shadow);animation:toastIn .4s var(--ease)}
.toast.err{background:#dc2626}.toast.ok{background:#16a34a}.toast.warn{background:var(--orange-d)}
.toast.out{opacity:0;transform:translateY(10px);transition:all .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

@media (max-width:640px){
  .opts,.ans-grid{grid-template-columns:1fr}
  .brand-text small{display:none}
  .podium{height:240px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore();
    });
    parts = parts.filter(p => p.y < c.height + 30);
    if (parts.length) requestAnimationFrame(frame); else { run = false; x.clearRect(0, 0, c.width, c.height); }
  }
  return {
    burst(n = 160) {
      if (reduceMotion) return;
      for (let i = 0; i < n; i++) parts.push({
        x: c.width / 2 + (Math.random() - .5) * 200, y: c.height * .35, vx: (Math.random() - .5) * 13, vy: -Math.random() * 12 - 3,
        w: 6 + Math.random() * 8, h: 8 + Math.random() * 10, r: Math.random() * 6, vr: (Math.random() - .5) * .35, c: cols[i % cols.length]
      });
      if (!run) { run = true; requestAnimationFrame(frame); }
    }
  };
})();

/* =========================================================
   Quiz model
   ========================================================= */
const newQuestion = (type = 'mcq') => ({
  id: uid(), type, text: '',
  options: [0, 1, 2, 3].map(i => ({ text: '', correct: i === 0 })),
  tf: true, answers: '', num: { value: '', tol: 0 }, time: 20, points: 1000
});
function sampleQuiz() {
  const o = (...a) => a.map(([text, correct]) => ({ text, correct: !!correct }));
  const q = (type, text, extra) => ({ ...newQuestion(type), text, ...extra });
  return {
    id: uid(), title: 'Sample: General Knowledge', questions: [
      q('mcq', 'Which planet is known as the Red Planet?', { options: o(['Mars', 1], ['Venus'], ['Jupiter'], ['Mercury']) }),
      q('tf', 'Sri Lanka is an island nation.', { tf: true, time: 10 }),
      q('multi', 'Select all the prime numbers.', { options: o(['2', 1], ['9'], ['5', 1], ['15']) }),
      q('text', 'Which is the largest ocean on Earth?', { answers: 'Pacific, Pacific Ocean', time: 30 }),
      q('number', 'How many continents are there?', { num: { value: 7, tol: 0 }, time: 15 }),
      q('poll', 'How are you feeling about this quiz?', { options: o(['Excited'], ['Ready'], ['Nervous'], ['Confident']), time: 15 })
    ]
  };
}
let quizzes = store.get('hh_quizzes', null);
if (!quizzes || !Array.isArray(quizzes)) { quizzes = [sampleQuiz()]; store.set('hh_quizzes', quizzes); }
const saveQuizzes = () => store.set('hh_quizzes', quizzes);

const isChoice = ty => ty === 'mcq' || ty === 'multi' || ty === 'poll';
function normalizeQ(q) {
  if (q.type === 'mcq') { const f = q.options.findIndex(o => o.correct); q.options.forEach((o, j) => o.correct = j === (f < 0 ? 0 : f)); }
  if (q.type === 'multi' && !q.options.some(o => o.correct)) q.options[0].correct = true;
}
function validateQ(q) {
  const e = [];
  if (!q.text.trim()) e.push('err_text');
  if (isChoice(q.type)) {
    const opts = q.options.filter(o => o.text.trim());
    if (opts.length < 2) e.push('err_options');
    else if (q.type !== 'poll') {
      const c = opts.filter(o => o.correct).length;
      if ((q.type === 'mcq' && c !== 1) || (q.type === 'multi' && c < 1)) e.push('err_correct');
    }
  }
  if (q.type === 'text' && !q.answers.split(',').some(s => s.trim())) e.push('err_answer');
  if (q.type === 'number' && (q.num.value === '' || isNaN(Number(q.num.value)))) e.push('err_number');
  return e;
}
const validateQuiz = qz => qz.questions.map((q, i) => ({ i, errs: validateQ(q) })).filter(x => x.errs.length);
// What actually runs live: empty options removed, numbers coerced.
function runtimeQuiz(qz) {
  return {
    title: qz.title.trim() || 'Untitled quiz', questions: qz.questions.map(q => ({
      ...q, text: q.text.trim(),
      options: isChoice(q.type) ? q.options.filter(o => o.text.trim()).map(o => ({ text: o.text.trim(), correct: !!o.correct })) : [],
      num: { value: Number(q.num.value), tol: Math.abs(Number(q.num.tol) || 0) },
      points: q.type === 'poll' ? 0 : q.points
    }))
  };
}
// What players are allowed to see — never contains correct answers.
const publicQ = (q, idx, total) => ({
  idx, total, type: q.type, text: q.text, time: q.time, points: q.points,
  options: isChoice(q.type) ? q.options.map(o => o.text) : []
});
const norm = s => String(s).normalize('NFKC').toLowerCase().replace(/\s+/g, ' ').trim();
function judge(q, ans) {
  switch (q.type) {
    case 'poll': return null;
    case 'mcq': return typeof ans === 'number' && !!q.options[ans]?.correct;
    case 'tf': return (ans === 0 && q.tf) || (ans === 1 && !q.tf);
    case 'multi': {
      const a = Array.isArray(ans) ? uniq(ans).sort() : [];
      const c = q.options.map((o, i) => o.correct ? i : -1).filter(i => i >= 0);
      return a.length === c.length && a.every((v, i) => v === c[i]);
    }
    case 'text': return q.answers.split(',').map(norm).filter(Boolean).includes(norm(ans));
    case 'number': return Math.abs(Number(ans) - Number(q.num.value)) <= Number(q.num.tol || 0) + 1e-9;
  }
  return false;
}
function correctText(q) {
  switch (q.type) {
    case 'mcq': case 'multi': return q.options.filter(o => o.correct).map(o => o.text).join(' • ');
    case 'tf': return t(q.tf ? 'true' : 'false');
    case 'text': return q.answers.split(',').map(s => s.trim()).filter(Boolean).join(' / ');
    case 'number': return q.num.tol ? `${q.num.value} ± ${q.num.tol}` : String(q.num.value);
  }
  return '';
}
// sanitise untrusted answer coming over the wire
function cleanAnswer(q, a) {
  if (q.type === 'mcq' || q.type === 'poll') { const n = Number(a); return Number.isInteger(n) && n >= 0 && n < q.options.length ? n : null; }
  if (q.type === 'tf') return a === 0 || a === 1 ? a : null;
  if (q.type === 'multi') { if (!Array.isArray(a)) return null; const r = uniq(a.map(Number).filter(n => Number.isInteger(n) && n >= 0 && n < q.options.length)).sort(); return r.length ? r : null; }
  if (q.type === 'text') { const s = String(a ?? '').slice(0, 120); return s.trim() ? s : null; }
  if (q.type === 'number') { const n = Number(a); return Number.isFinite(n) ? n : null; }
  return null;
}

/* =========================================================
   Shared answer UI (players + preview)
   ========================================================= */
function buildAnswerUI(el, q, { onSubmit, locked = false, value = null }) {
  el.innerHTML = ''; const wrap = document.createElement('div'); el.append(wrap);
  const labels = q.type === 'tf' ? [t('true'), t('false')] : q.options;
  if (q.type === 'mcq' || q.type === 'tf' || q.type === 'poll') {
    wrap.className = 'ans-grid n' + labels.length;
    labels.forEach((l, j) => {
      const b = document.createElement('button'); b.className = 'ans a' + (q.type === 'tf' ? (j ? 1 : 0) : j % 4);
      b.style.setProperty('--i', j);
      b.innerHTML = `<span class="shape">${SHAPES[j]}</span><span class="lbl">${esc(l)}</span>`;
      if (locked) { b.disabled = true; if (value === j) b.classList.add('picked'); }
      b.onclick = () => { $$('.ans', wrap).forEach(x => x.disabled = true); b.classList.add('picked'); onSubmit(j); };
      wrap.append(b);
    });
  } else if (q.type === 'multi') {
    wrap.className = 'ans-grid n' + labels.length;
    const sel = new Set(locked && Array.isArray(value) ? value : []);
    labels.forEach((l, j) => {
      const b = document.createElement('button'); b.className = 'ans a' + (j % 4) + (sel.has(j) ? ' sel' : ''); b.style.setProperty('--i', j);
      b.innerHTML = `<span class="shape">${SHAPES[j]}</span><span class="lbl">${esc(l)}</span>`; b.disabled = locked;
      b.onclick = () => { sel.has(j) ? sel.delete(j) : sel.add(j); b.classList.toggle('sel'); go2.disabled = !sel.size; };
      wrap.append(b);
    });
    const row = document.createElement('div'); row.className = 'submit-row';
    const go2 = document.createElement('button'); go2.className = 'btn accent lg'; go2.textContent = t('submit'); go2.disabled = locked || !sel.size;
    go2.onclick = () => { $$('.ans', wrap).forEach(x => x.disabled = true); go2.disabled = true; onSubmit([...sel].sort()); };
    row.append(go2); el.append(row);
  } else {
    wrap.className = 'text-ans';
    const inp = document.createElement('input'); inp.className = 'field';
    inp.placeholder = t('type_here'); inp.maxLength = 120; inp.autocomplete = 'off';
    if (q.type === 'number') { inp.type = 'number'; inp.step = 'any'; inp.inputMode = 'decimal'; }
    const btn = document.createElement('button'); btn.className = 'btn accent lg'; btn.textContent = t('submit');
    if (locked) { inp.disabled = btn.disabled = true; inp.value = value ?? ''; }
    const send = () => {
      const v = inp.value.trim(); if (!v) return; const a = q.type === 'number' ? Number(v) : v;
      if (q.type === 'number' && !Number.isFinite(a)) return;
      inp.disabled = btn.disabled = true; onSubmit(a);
    };
    btn.onclick = send; inp.onkeydown = e => { if (e.key === 'Enter') send(); };
    wrap.append(inp, btn); if (!locked) setTimeout(() => inp.focus(), 60);
  }
}

/* =========================================================
   Transport  (BroadcastChannel; localStorage-event fallback)
   Swap this class for a WebSocket client to go multi-device —
   host/player logic only uses send(type, data) + onmsg(msg).
   ========================================================= */
class Net {
  constructor(code, onmsg) {
    this.onmsg = onmsg; this.seen = new Set(); this.key = 'hh-' + code;
    this.bc = 'BroadcastChannel' in window ? new BroadcastChannel(this.key) : null;
    if (this.bc) this.bc.onmessage = e => this._in(e.data);
    else { this._st = e => { if (e.key === this.key && e.newValue) { try { this._in(JSON.parse(e.newValue)); } catch {} } }; addEventListener('storage', this._st); }
  }
  send(type, d = {}) {
    const m = { id: uid() + uid(), type, d, at: Date.now() }; this.seen.add(m.id);
    if (this.bc) this.bc.postMessage(m); else { try { localStorage.setItem(this.key, JSON.stringify(m)); } catch {} }
  }
  _in(m) {
    if (!m || !m.id || this.seen.has(m.id)) return;          // dedupe replayed / echoed messages
    this.seen.add(m.id); if (this.seen.size > 400) this.seen = new Set([...this.seen].slice(-200));
    try { this.onmsg(m); } catch (err) { console.error(err); }
  }
  close() { if (this.bc) this.bc.close(); else removeEventListener('storage', this._st); }
}
// Timers that keep running when the tab is in the background (browsers throttle setInterval there).
function ticker(ms, fn) {
  let stop = () => {}, fell = false;
  const fallback = () => { if (fell) return; fell = true; const id = setInterval(fn, ms); stop = () => clearInterval(id); };
  try {
    const url = URL.createObjectURL(new Blob([`setInterval(()=>postMessage(0),${ms})`], { type: 'text/javascript' }));
    const w = new Worker(url); w.onmessage = () => fn(); w.onerror = () => { w.terminate(); fallback(); };
    stop = () => { w.terminate(); URL.revokeObjectURL(url); };
  } catch { fallback(); }
  return () => stop();
}

let S = null, hostNet = null, stopTick = null, stopHb = null;
const curQ = () => S.quiz.questions[S.qi];

const genCode = () => { let c; do c = String(Math.floor(100000 + Math.random() * 900000)); while (c === store.get('hh_host', {}).code); return c; };

function startSession(quiz) {

  S = { code: genCode(), quiz: rq, phase: 'lobby', qi: -1, startsAt: 0, endsAt: 0, players: {}, locked: false, seq: 0, reveal: null, createdAt: Date.now() };
  openHostNet(); persist(); go('host');

function resumeSession() {

  S = saved; Object.values(S.players).forEach(p => { p.seen = Date.now(); });   // give players time to re-announce
  openHostNet(); S.seq++; persist(); hostNet.send('state', stateMsg()); go('host');
}
function openHostNet() {

  stopTick = ticker(250, hostTick);
  stopHb = ticker(2000, () => hostNet && S && hostNet.send('hb', { phase: S.phase, seq: S.seq, qi: S.qi, hostNow: Date.now() }));
}
function closeHostNet() { stopTick && stopTick(); stopHb && stopHb(); hostNet && hostNet.close(); stopTick = stopHb = hostNet = null; }
function endSession() {

function ranked() {

  let r = 0, prev = null; arr.forEach((p, i) => { if (p.score !== prev) { r = i + 1; prev = p.score; } p.rank = r; }); return arr;
}
function stateMsg() {

  if (S.phase === 'ready') s.startsAt = S.startsAt;
  if (S.phase === 'question') { s.q = publicQ(curQ(), S.qi, total); s.endsAt = S.endsAt; }
  if (S.phase === 'reveal') { s.q = publicQ(curQ(), S.qi, total); s.reveal = S.reveal; }

    s.mine = {}; arr.forEach(p => s.mine[p.id] = { score: p.score, rank: p.rank, streak: p.streak });

}

const reply = (type, to, d = {}) => hostNet && hostNet.send(type, { ...d, to });

function onHostMsg(m) {

}
function handleJoin(d) {

  if (S.locked) return reply('denied', d.pid, { reason: 'locked' });

  const taken = n => Object.values(S.players).some(p => p.name.toLowerCase() === n.toLowerCase());
  if (taken(name)) { let k = 2; while (taken(`${name} ${k}`)) k++; name = `${name} ${k}`; }   // duplicate-name fix
  S.players[d.pid] = { id: d.pid, name, score: 0, streak: 0, seen: Date.now(), online: true, answers: {} };

function handleAnswer(d) {

/* =========================================================
   PLAYER ENGINE
   ========================================================= */
let P = null, pBeat = null, pPing = null, pWatch = null;
function joinGame(code, name, auto) {
  const saved = sess.get('hh_player', null);   // read before leavePlayer() clears it
  leavePlayer(true);
  const pid = saved && saved.code === code ? saved.pid : uid();
  P = { pid, code, name, net: null, offset: 0, bestRtt: Infinity, state: null, seq: -1, answered: {}, hostSeen: Date.now(), joined: false, score: 0, lost: false, lastKey: '' };
  P.net = new Net(code, onPlayerMsg);
  const attempt = () => P && !P.joined && P.net.send('join', { pid, name });
  attempt(); const r1 = setTimeout(attempt, 700), r2 = setTimeout(attempt, 1500);
  setTimeout(() => { if (P && !P.joined && P.pid === pid) { clearTimeout(r1); clearTimeout(r2); leavePlayer(true); if (!auto) toast(t('room_not_found'), 'err'); go('home'); } }, 2600);
  toast(t('joining'));
}
function startPlayerTimers() {
  const ping = () => P && P.net.send('ping', { pid: P.pid, t0: Date.now() });
  ping(); pPing = ticker(10000, ping);
  pBeat = ticker(3000, () => P && P.net.send('beat', { pid: P.pid }));
  pWatch = ticker(1000, () => {
    if (!P) return; const lost = Date.now() - P.hostSeen > 7000;
    if (lost !== P.lost) { P.lost = lost; banner(lost ? t('host_lost') : t('reconnected'), !lost); if (!lost) P.net.send('sync', { pid: P.pid }); }
  });
}
function banner(msg, ok) { const b = $('#conn-banner'); b.textContent = msg; b.className = 'conn-banner' + (ok ? ' ok' : ''); b.hidden = false; if (ok) setTimeout(() => { b.hidden = true; }, 2000); }
function leavePlayer(silent) {
  if (!P) return; pBeat && pBeat(); pPing && pPing(); pWatch && pWatch(); pBeat = pPing = pWatch = null;
  try { P.net.send('leave', { pid: P.pid }); } catch {} P.net.close(); P = null; sess.del('hh_player'); $('#conn-banner').hidden = true;
  if (!silent) go('home');
}
function onPlayerMsg(m) {
  if (!P) return; const d = m.d || {};
  if (d.to && d.to !== P.pid) return;
  switch (m.type) {
    case 'joined': if (!P.joined) { P.joined = true; P.name = d.name; sess.set('hh_player', { code: P.code, name: P.name, pid: P.pid }); startPlayerTimers(); } P.hostSeen = Date.now(); applyState(d.state); if (route !== 'play') go('play'); return;
    case 'denied': { const c = d.reason; leavePlayer(true); toast(t(c === 'locked' ? 'room_locked' : 'room_not_found'), 'err'); go('home'); return; }
    case 'state': if (!P.joined) return; P.hostSeen = Date.now(); return applyState(d);
    case 'hb': if (!P.joined) return; P.hostSeen = Date.now(); if (d.seq > P.seq) P.net.send('sync', { pid: P.pid }); return;   // missed a state → ask for it
    case 'pong': { const now = Date.now(), rtt = now - d.t0; if (rtt <= P.bestRtt) { P.bestRtt = rtt; P.offset = d.hostNow + rtt / 2 - now; } return; }
    case 'ack': if (P.answered[d.qi]) P.answered[d.qi].acked = true; return;
    case 'late': if (P.answered[d.qi] && !P.answered[d.qi].acked) { P.answered[d.qi].acked = true; toast(t('no_answer'), 'warn'); } return;
    case 'unknown': if (P.joined) P.net.send('join', { pid: P.pid, name: P.name }); return;   // host lost us (e.g. restarted) → re-announce
    case 'kick': toast(t('kicked'), 'err'); return leavePlayer();
    case 'ended': if (P.state && P.state.phase === 'final') return; toast(t('host_ended'), 'warn'); return leavePlayer();
  }
}
function applyState(s) {

  P.seq = s.seq; P.state = s;
  if (P.bestRtt === Infinity) P.offset = s.hostNow - Date.now();
  const me = s.mine && s.mine[P.pid]; if (me) { const old = P.score; P.score = me.score; if (route === 'play') { const el = $('#myScore'); el && animateNumber(el, old, me.score); } }
  const key = s.phase + ':' + s.qi;
  if (key !== P.lastKey) { P.lastKey = key; if (route === 'play') renderPlayStage(); }
  else if (s.phase === 'lobby' && route === 'play') { const c = $('#lobbyCount'); if (c) c.textContent = s.count; }
}
function renderPlay() { if (!P) return go('home'); renderPbar(); P.lastKey = P.state ? P.state.phase + ':' + P.state.qi : ''; renderPlayStage(); }
function renderPbar() {
  $('#pbar').innerHTML = `<div class="who"><span class="avatar" style="background:${colorFor(P.name)}">${esc(initial(P.name))}</span><span>${esc(P.name)}</span></div>
    <span class="score-pill">★ <span id="myScore">${P.score.toLocaleString()}</span></span><button class="btn ghost sm" data-act="leave">${esc(t('leave'))}</button>`;
}
$('#pbar').addEventListener('click', e => { if (e.target.closest('[data-act=leave]')) leavePlayer(); });
function renderPlayStage() {
  const el = $('#playStage'), s = P.state; if (!el) return;
  if (!s) { el.innerHTML = `<div class="stage"><div class="spinner"></div></div>`; return; }
  const me = s.mine?.[P.pid] || { score: P.score, rank: '-', streak: 0 };
  if (s.phase === 'lobby') {
    el.innerHTML = `<div class="stage"><div class="avatar big" style="background:${colorFor(P.name)}">${esc(initial(P.name))}</div>
      <h2>${esc(t('youre_in'))}</h2><div class="pill o">${esc(P.name)}</div><p class="muted">${esc(s.title)}</p>
      <div class="pill">${esc(t('players'))}: <b id="lobbyCount">${s.count}</b></div>
      <p class="waiting-dots muted">${esc(t('waiting_host'))}</p></div>`;
  } else if (s.phase === 'ready') {
    el.innerHTML = `<div class="stage"><div class="eyebrow">${esc(t('question_of', { n: s.qi + 1, total: s.total }))}</div><h2>${esc(t('get_ready'))}</h2>
      <div class="big-count" data-cd="${s.startsAt}" data-role="p">3</div></div>`;
  } else if (s.phase === 'question') {
    const q = s.q, a = P.answered[s.qi];
    el.innerHTML = `<div class="stage" style="align-items:stretch"><div class="bar" data-end="${s.endsAt}" data-total="${q.time * 1000}" data-role="p"><i></i></div>
      <div style="display:flex;justify-content:space-between"><span class="pill">${esc(t('question_of', { n: s.qi + 1, total: s.total }))}</span>${q.type === 'poll' ? '' : `<span class="pill o">★ ${q.points}</span>`}</div>
      <h2 class="qtext">${esc(q.text)}</h2><div id="ansHost"></div><div id="lockMsg" style="text-align:center"></div></div>`;
    buildAnswerUI($('#ansHost'), q, { onSubmit: submitAnswer, locked: !!a, value: a?.ans });
    if (a) showLock();
  } else if (s.phase === 'reveal') {
    const r = s.reveal.results[P.pid] || { pts: 0, ok: false, answered: false }, q = s.q;
    const cls = q.type === 'poll' ? 'poll' : !r.answered ? 'none' : r.ok ? 'ok' : 'bad';
    const head = q.type === 'poll' ? '🗳 ' + t('poll_thanks') : !r.answered ? '⏰ ' + t('no_answer') : r.ok ? '✓ ' + t('correct') : '✗ ' + t('wrong');
    el.innerHTML = `<div class="stage"><div class="result ${cls}"><div class="big">${esc(head)}</div>${q.type === 'poll' ? '' : `<div class="pts">+<span id="gain">0</span></div>`}</div>
      ${q.type === 'poll' ? '' : `<div class="muted">${esc(t('correct_answer'))}: <b style="color:var(--text)">${esc(s.reveal.correct)}</b></div>`}
      <div class="stat-row"><div class="stat"><b>#${me.rank}</b><span>${esc(t('rank'))}</span></div><div class="stat"><b>${me.score.toLocaleString()}</b><span>${esc(t('score'))}</span></div>
      <div class="stat"><b>🔥 ${me.streak}</b><span>${esc(t('streak'))}</span></div></div><p class="waiting-dots muted">${esc(t('wait_others'))}</p></div>`;
    const g = $('#gain'); if (g) animateNumber(g, 0, r.pts, 900);
    if (r.ok) confetti.burst(60);
  } else if (s.phase === 'board') {
    el.innerHTML = `<div class="stage"><h2>🏆 ${esc(t('leaderboard'))}</h2><div class="stat-row"><div class="stat"><b>#${me.rank}</b><span>${esc(t('rank'))}</span></div>
      <div class="stat"><b>${me.score.toLocaleString()}</b><span>${esc(t('score'))}</span></div></div><div class="board" id="pBoard"></div><p class="waiting-dots muted">${esc(t('wait_others'))}</p></div>`;
    renderBoard($('#pBoard'), s.top.slice(0, 5), { limit: 5 });
  } else {
    el.innerHTML = `<div class="stage"><h2>🎉 ${esc(t('final_results'))}</h2><div class="result ${me.rank <= 3 ? 'ok' : 'poll'}"><div class="big">${me.rank === 1 ? '🥇' : me.rank === 2 ? '🥈' : me.rank === 3 ? '🥉' : '🏅'} #${me.rank}</div>
      <div class="pts">${me.score.toLocaleString()}</div></div><div class="board" id="pBoard"></div><div class="actions"><button class="btn lg" data-act="leave">⌂ ${esc(t('back_home'))}</button></div></div>`;
    renderBoard($('#pBoard'), s.top.slice(0, 5), { limit: 5 });
    if (me.rank <= 3) setTimeout(() => confetti.burst(200), 500);
  }
}
$('#playStage').addEventListener('click', e => { if (e.target.closest('[data-act=leave]')) leavePlayer(); });
function showLock() { const l = $('#lockMsg'); if (l) l.innerHTML = `<div class="lock">✓ ${esc(t('locked_in'))}</div><p class="waiting-dots muted" style="margin-top:8px">${esc(t('wait_others'))}</p>`; }
function submitAnswer(ans) {
  const qi = P.state.qi; if (P.answered[qi]) return;
  P.answered[qi] = { ans, acked: false, tries: 0 }; showLock();
  const send = () => {
    const a = P && P.answered[qi]; if (!a || a.acked || a.tries >= 5) return;
    a.tries++; P.net.send('answer', { pid: P.pid, qi, ans: a.ans, sentAt: Date.now() }); setTimeout(send, 1200);   // retry until acknowledged
  };
  send();
}

/* =========================================================
   Frame loop: timers & countdowns (host + player)
   ========================================================= */
function onTimeUp(el) { if (el.dataset.role === 'p') $$('#ansHost button, #ansHost input').forEach(b => b.disabled = true); }
function loop() {
  const now = Date.now();
  $$('[data-end]').forEach(el => {
    const off = el.dataset.role === 'p' ? (P ? P.offset : 0) : 0, end = +el.dataset.end, total = +el.dataset.total;
    const rem = Math.max(0, end - (now + off)), f = clamp(rem / total, 0, 1);
    if (el.classList.contains('ring')) {
      $('.ring-fg', el).style.strokeDashoffset = (276.46 * (1 - f)).toFixed(2);
      const n = Math.ceil(rem / 1000), num = $('.ring-num', el); if (num.textContent != n) num.textContent = n;
    } else $('i', el).style.transform = `scaleX(${f})`;
    el.classList.toggle('low', rem > 0 && rem < 5000);
    if (rem <= 0 && !el.dataset.done) { el.dataset.done = 1; onTimeUp(el); }
  });
  $$('[data-cd]').forEach(el => {
    const off = el.dataset.role === 'p' ? (P ? P.offset : 0) : 0, n = Math.max(1, Math.ceil((+el.dataset.cd - (now + off)) / 1000));
    if (el.textContent != n) { el.textContent = n; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  });
  requestAnimationFrame(loop);
}

/* =========================================================
   Navigation bar
   ========================================================= */
Object.assign(I18N.en, { nav_home: 'Home' });
Object.assign(I18N.ta, { nav_home: 'முகப்பு' });
Object.assign(I18N.si, { nav_home: 'මුල් පිටුව' });

const siteHead = $('#siteHead'), siteNav = $('#siteNav');
const NAV = {
  home: () => go('home'),
  dashboard: () => go('dashboard'),
  new: () => openEditor(null),
  join: () => {
    go('home');
    setTimeout(() => { const f = $('#joinCode'); f.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' }); f.focus({ preventScroll: true }); }, 350);
  }
};
$$('[data-nav]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); NAV[a.dataset.nav](); }));

// Highlights the current section, and hides the bar during a live game so nobody navigates away from it
function syncNav() {
  siteNav.hidden = route === 'host' || route === 'play';
  const current = route === 'editor' ? 'dashboard' : route;
  $$('[data-nav]').forEach(a => {
    const on = a.dataset.nav === current;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
// Keeps sticky editor/toast offsets in step with the header's real height
new ResizeObserver(() => document.documentElement.style.setProperty('--head-h', siteHead.offsetHeight + 'px')).observe(siteHead);
syncNav();

/* =========================================================
   Boot
   ========================================================= */
$('#themeBtn').onclick = () => setTheme(curTheme() === 'dark' ? 'light' : 'dark');
$$('[data-lang]').forEach(b => b.onclick = () => setLang(b.dataset.lang));
$('#brand').onclick = e => { e.preventDefault(); if (route === 'home') return; if (route === 'play' || route === 'host') return; go(route === 'editor' ? 'dashboard' : 'home'); };
$('#btnHost').onclick = () => go('dashboard');
$('#btnNew').onclick = () => openEditor(null);
$('#joinCode').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
$('#joinForm').addEventListener('submit', e => {
  e.preventDefault(); const code = $('#joinCode').value.trim(), name = $('#joinName').value.trim();
  if (!/^\d{6}$/.test(code) || !name) return toast(t('room_not_found'), 'warn');
  joinGame(code, name);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && P && P.joined) P.net.send('sync', { pid: P.pid }); });
addEventListener('online', () => { if (P && P.joined) P.net.send('sync', { pid: P.pid }); });

setTheme(curTheme());
applyStatic();
requestAnimationFrame(loop);
const savedPlayer = sess.get('hh_player', null);
if (savedPlayer) joinGame(savedPlayer.code, savedPlayer.name, true);   // refresh-safe: players rejoin automatically
})();

</script>
